
name: Build TurfBuddie APK + Web + iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: TurfBuddie-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TurfBuddie-Web
          path: build/web/

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create --org com.turfbuddie --project-name turfbuddie_mock --platforms=ios .

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          /usr/bin/zip -r TurfBuddie-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TurfBuddie-iOS-unsigned
          path: TurfBuddie-unsigned.ipa
