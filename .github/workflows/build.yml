name: Build TurfBuddie APK + Web

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --org com.turfbuddie --project-name turfbuddie_mock --platforms=android,web
      - run: sed -i 's/android:label="[^"]*"/android:label="TurfBuddie"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: TurfBuddie-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TurfBuddie-Web
          path: build/web
