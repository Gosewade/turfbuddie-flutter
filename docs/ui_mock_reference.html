<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TurfBuddie – UI Mock</title>
<style>
:root{--bg:#fff;--fg:#0b140e;--mut:#5b6b60;--card:#fff;--bd:#e3ebe5;--g:#16a34a;--gd:#166534;--gl:#e8f7ed;--out:#eaf1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f0c;--fg:#eef5ef;--mut:#9db0a2;--card:#121a14;--bd:#233028;--gl:#12301c;--gd:#86efac;--out:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f0c;--fg:#eef5ef;--mut:#9db0a2;--card:#121a14;--bd:#233028;--gl:#12301c;--gd:#86efac;--out:#000;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--out);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:460px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:84px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;line-height:1}
.logo i{width:38px;height:38px;border-radius:50%;background:linear-gradient(90deg,#22c55e 50%,#86d17b 50%);display:grid;place-items:center;font-style:normal;font-size:11px;color:#111}
.hd button{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:12px;padding:8px 10px;margin-left:6px;cursor:pointer;font-size:14px}
main{padding:16px}
h1{font-size:38px;line-height:1.08;margin:14px 0;font-weight:900;letter-spacing:-1px}
h2{margin:0 0 6px;font-size:24px;font-weight:900}
.g{color:var(--g)}.mut{color:var(--mut)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;background:var(--g);color:#fff;cursor:pointer;margin-top:10px}
.btn.o{background:none;color:var(--gd);border:2px solid var(--g)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:800;background:var(--gl);color:var(--gd);margin:0 6px 6px 0}
.pill.on{background:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}
.stats b{display:block;font-size:30px;color:var(--g);font-weight:900}
.tc{border-radius:20px;overflow:hidden;border:1px solid var(--bd);margin-bottom:16px;cursor:pointer;background:var(--card)}
.tc .im{height:96px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#15803d,#4ade80)}
.tc .bd{padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{background:var(--g);color:#fff;border-radius:12px;padding:7px 13px;font-weight:800;display:inline-block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:8px 14px;cursor:pointer;font-weight:600}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sl{border:1px solid var(--bd);border-radius:16px;padding:10px;text-align:center;cursor:pointer;background:var(--card)}
.sl b{display:block}.sl small{color:var(--g)}
.sl.on{border:2.5px solid var(--g);background:var(--gl)}
.sl.x{opacity:.45;cursor:not-allowed}.sl.x b{text-decoration:line-through}.sl.x small{color:#e11d48}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:100%;max-width:460px;padding:8px 16px;background:var(--bg);border-top:1px solid var(--bd)}
.bar .btn{margin:0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 8px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--g);font-weight:800}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font-size:15px}
.tr{display:flex;justify-content:space-between;padding:6px 0}
.tot{font-size:20px;font-weight:900;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--gl);display:grid;place-items:center;font-weight:900;color:var(--gd);flex:none}
.bar2{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 12px}.bar2 div{height:100%;background:var(--g)}
.ev{border-radius:20px;overflow:hidden;border:1px solid var(--bd);margin-bottom:16px;background:var(--card)}
.ev .top{padding:16px;color:#fff;background:linear-gradient(135deg,#065f46,#10b981);min-height:110px}
.ev .top h3{margin:22px 0 0;font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
.hide{display:none}
.lg{height:44px}main{animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card,.tc,.ev{box-shadow:0 4px 18px rgba(0,0,0,.06)}
.pitch{position:relative;background:repeating-linear-gradient(90deg,#1f8f45 0 34px,#25a653 34px 68px);overflow:hidden}
.pitch:before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.75);border-radius:6px}
.pitch:after{content:"";position:absolute;left:50%;top:14px;bottom:14px;border-left:2px solid rgba(255,255,255,.75)}
.pitch .c{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border:2px solid rgba(255,255,255,.75);border-radius:50%;z-index:1}
.pitch .fl{position:absolute;top:-34px;width:110px;height:110px;background:radial-gradient(circle,rgba(255,255,190,.6),transparent 70%)}
.bg{position:absolute;z-index:2;background:rgba(0,0,0,.62);color:#fff;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;backdrop-filter:blur(4px)}
.sh{grid-column:1/-1;font-weight:800;margin-top:8px}
input[type=search]{margin:6px 0 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:end center;z-index:30}
.tk{width:100%;max-width:460px;background:var(--bg);border-radius:26px 26px 0 0;padding:20px;max-height:92vh;overflow:auto;animation:up .3s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.qr{display:grid;grid-template-columns:repeat(13,1fr);width:130px;margin:14px auto}.qr i{aspect-ratio:1}
.au{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto}.gh{background:#0da55b;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 26px) 20px 22px}
.gh.tall{min-height:170px;display:flex;flex-direction:column;justify-content:flex-end}.gh.dk{background:linear-gradient(#2b3b2f,#0f1a12)}
.gh small{opacity:.85;font-size:16px;display:block}.gh b{font-size:28px;font-weight:900}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:0 14px;margin-bottom:12px;box-shadow:0 2px 6px #0001;cursor:text}
.sb input{border:0;background:none;outline:0;padding:14px 0;flex:1;color:var(--fg);font-size:15px}
.rc{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px;margin-bottom:12px;cursor:pointer}
.th{width:96px;height:100px;border-radius:14px;background:linear-gradient(135deg,#14532d,#22c55e);display:grid;place-items:center;font-size:40px;flex:none}
.rt{background:var(--gl);color:var(--gd);border-radius:12px;padding:2px 8px;font-weight:800;font-size:12px}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.fc{min-width:88%;height:220px;border-radius:22px;background:linear-gradient(135deg,#0f2a1d,#1f7a4a);position:relative;scroll-snap-align:center;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:60px}
.fc>*{position:absolute}.st{border-radius:12px;padding:3px 10px;color:#fff;font-size:11px;font-weight:700}
</style>
</head>

turfs:()=>`<div class="sb">🔍<input placeholder="Search turfs by name..." value="${S.q||''}" oninput="S.q=this.value;$('tl').innerHTML=TL()"></div><div class="card row" style="cursor:pointer;margin-bottom:6px" onclick="S.fo=!S.fo;draw()"><b>🔻 Filter Turfs</b><span>${S.fo?'▴':'▾'}</span></div>${S.fo?`<div class="card"><b>Sport</b><div class="chips" style="margin:6px 0"><button class="${S.sport?'':'on'}" onclick="S.sport='';draw()">All</button>${Object.keys(E).map(s=>`<button class="${S.sport===s?'on':''}" onclick="S.sport='${s}';draw()">${E[s]} ${s}</button>`).join('')}</div><b>Sort</b><div class="chips" style="margin-top:6px">${[['d','Nearest'],['p','Price: Low'],['r','Top Rated']].map(o=>`<button class="${(S.sort||'d')===o[0]?'on':''}" onclick="S.sort='${o[0]}';draw()">${o[1]}</button>`).join('')}</div></div>`:''}<div id="tl">${TL()}</div>`,
prof:()=>{const u=S.user,it=(ic,c,t,s,f)=>`<div class="card row" style="cursor:pointer" onclick="${f}"><span style="width:42px;height:42px;border-radius:12px;background:${c}22;display:grid;place-items:center;font-size:20px">${ic}</span><div style="flex:1"><b>${t}</b><div class="mut" style="font-size:12px">${s}</div></div>›</div>`;
return `<div class="card row"><span style="font-size:34px">👤</span><div style="flex:1"><b style="font-size:18px">${u?u.n:'Guest'}</b><div class="mut" style="font-size:12px">${u?(u.e||'+91 '+u.ph):'Login to book turfs & join tournaments'}</div>${u?`<div class="mut" style="font-size:12px">${u.c} · ${u.r}</div>`:''}</div></div>${u?'':'<button class="btn" onclick="au(\'login\')">Login / Sign up</button><div style="height:12px"></div>'}${it('⚙️','#16a34a','Account Settings','Manage your personal information',"say('Coming soon')")}${it('📖','#3b82f6','Your Bookings','View all your bookings',"go('book')")}${it('👥','#ea580c','Find Players',S.team?'Team: '+S.team.n:'Create a team & invite players',"S.view='pl';draw()")}${it('🧮','#0ea5e9','Match Calculator','Split cost & cricket run rate',"S.view='mc';draw()")}${it('🎧','#f97316','Help & Support','Get help with your bookings',"say('Coming soon')")}${it('🛡️','#9333ea','Privacy Policy','Read our privacy policy',"say('Coming soon')")}${it('🌓','#64748b','Dark mode','Switch theme',"theme()")}${u?`<button class="btn o" onclick="S.user=null;S.team=null;S.pl={};draw();say('Logged out')">Logout</button>`:''}`},
mc:()=>MCV(),
book:()=>BKV(),
};

const FT={'Find Player':"go('pl')",'Tournaments':"go('ev')",'Turf Booking':"go('turfs')",'Split Payment':"go('turfs')"};
const PL=[['Aryan K.','Football','Intermediate','Dharampeth'],['Rohit S.','Cricket','Advanced','Ram Nagar'],['Vikram P.','Football','Beginner','Manish Nagar'],['Sneha D.','Badminton','Intermediate','Sadar'],['Kunal M.','Basketball','Advanced','Sitabuldi'],['Isha R.','Tennis','Beginner','Civil Lines']];
function inv(n){need(()=>{if(!S.team){S.tm=true;S.at=()=>inv(n);S.err='';draw();return}if(S.pl[n])return;S.pl[n]=1;S.team.inv.push(n);draw();say('Invite sent to '+n+' for '+S.team.n)})}
function mkTeam(){const n=(S.f.tn||'').trim();if(n.length<3)return er('Team name must be at least 3 characters');S.team={n,sp:S.tf.sp,sk:S.tf.sk,nd:S.tf.nd,inv:[]};S.tm=false;S.err='';S.f.tn='';draw();say('Team created ✓');const a=S.at;S.at=null;if(a)setTimeout(a,60)}
function PLV(){const u=S.user,t=S.team,ok=u&&t,l=PL.filter(p=>!S.ps||p[1]===S.ps);
const st=(n,d,ti,sub,act,lock)=>`<div class="row" style="align-items:flex-start;margin-bottom:14px"><span style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex:none;background:${d?'var(--g)':lock?'var(--bd)':'var(--gl)'};color:${d?'#fff':'var(--gd)'}">${d?'✓':n}</span><div style="flex:1"><b style="${lock?'opacity:.5':''}">${ti}</b><div class="mut" style="font-size:13px">${sub}</div>${act||''}</div></div>`;
const sb='class="btn" style="width:auto;padding:8px 16px;margin:8px 0 0"';
return `<a href="#" class="g" style="font-weight:800" onclick="S.view='';draw();return false">← Back</a><h2>Find Player</h2><p class="mut">Join or build squads. Filter by sport & skill.</p><div class="card"><b style="font-size:18px">Get started in 3 steps</b><div style="height:12px"></div>
${st(1,u,'Create account / Login',u?'Logged in as '+u.n:'Required to invite players',u?'':`<button ${sb} onclick="pf()">Login / Sign up</button>`)}
${st(2,t,'Create your team',t?t.n+' · '+E[t.sp]+' '+t.sp+' · '+t.sk:'Name, sport & skill level',t?'':`<button ${sb} onclick="need(()=>{S.tm=true;S.at=null;S.err='';draw()})">Create team</button>`)}
${st(3,ok&&t.inv.length,'Invite players',ok?t.inv.length+' invite(s) sent · need '+t.nd+' more':'Unlocks after steps 1 & 2','',!ok)}</div>
<div class="chips">${['',...Object.keys(E)].map(s=>`<button class="${S.ps===s?'on':''}" onclick="S.ps='${s}';draw()">${s?E[s]+' '+s:'All'}</button>`).join('')}</div>
${l.map(p=>`<div class="card row"><span style="width:40px;height:40px;border-radius:50%;background:var(--gl);color:var(--gd);display:grid;place-items:center;font-weight:900;flex:none">${p[0][0]}</span><div style="flex:1"><b>${p[0]}</b><div class="mut" style="font-size:13px">${E[p[1]]} ${p[1]} · ${p[2]} · ${p[3]}</div></div><button class="btn ${S.pl[p[0]]?'o':''}" style="width:110px;margin:0;padding:10px" ${S.pl[p[0]]?'disabled':''} onclick="inv('${p[0]}')">${S.pl[p[0]]?'Invited':ok?'Invite':'🔒 Invite'}</button></div>`).join('')}`}
function teamv(){const f=S.tf,e=S.err?`<p style="color:#e11d48;font-weight:600">${S.err}</p>`:'';const bs='style="border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer"';
return `<div class="ov" onclick="S.tm=false;draw()"><div class="tk" onclick="event.stopPropagation()"><h2>Create your team</h2>${F('tn','Team name')}<b>Sport</b><div class="chips" style="margin:6px 0">${Object.keys(E).map(s=>`<button class="${f.sp===s?'on':''}" onclick="S.tf.sp='${s}';draw()">${E[s]} ${s}</button>`).join('')}</div><b>Skill level</b><div class="chips" style="margin:6px 0">${['Beginner','Intermediate','Advanced'].map(s=>`<button class="${f.sk===s?'on':''}" onclick="S.tf.sk='${s}';draw()">${s}</button>`).join('')}</div>
<div class="row" style="margin:8px 0"><b>Players needed</b><span><button ${bs} onclick="S.tf.nd=Math.max(1,S.tf.nd-1);draw()">−</button> <b style="font-size:18px;margin:0 6px">${f.nd}</b> <button ${bs} onclick="S.tf.nd=Math.min(15,S.tf.nd+1);draw()">+</button></span></div>${e}<button class="btn" onclick="mkTeam()">Create team</button></div></div>`}

const rc=t=>`<div class="rc" onclick="open_(${t.id})"><div class="th">${E[t.s[0]]}</div><div style="flex:1;min-width:0"><div class="row"><b>${t.n}</b><span class="rt">★ ${t.r}</span></div><div class="mut" style="font-size:12px">📍 ${t.a}</div><div class="g" style="font-size:12px">🚶 ${t.d} km</div><div class="row" style="margin-top:6px"><b class="g">${ru(t.p)} / hour</b><span class="rt" style="padding:6px 12px">Book Now</span></div></div></div>`;
const TTL={turfs:'Find Turfs Near You',book:'My Bookings',ev:'Tournaments',prof:'My Profile',pl:'Find Player',mc:'Match Calculator',detail:'Book a Slot',split:'Split Payment'};
function GH(k){if(k==='home')return `<div class="gh tall"><small>Your Location</small><b style="cursor:pointer" onclick="S.city=S.city==='Nagpur'?'Pune':'Nagpur';draw()">📍 ${S.city}</b></div>`;return `<div class="gh tall ${k==='book'?'dk':''}"><b>${k==='detail'&&S.turf?S.turf.n:(TTL[k]||'Checkout')}</b></div>`}
function TL(){const q=(S.q||'').toLowerCase(),l=T.filter(t=>(!S.sport||t.s.includes(S.sport))&&(t.n+t.a).toLowerCase().includes(q)).sort((a,b)=>S.sort==='p'?a.p-b.p:S.sort==='r'?b.r-a.r:a.d-b.d);return `<p class="mut" style="margin:6px 0 10px">${l.length} turfs near ${S.city}</p>`+(l.length?l.map(rc).join(''):'<p class="mut" style="text-align:center;padding:30px">🤷 No turfs match your search</p>')}
function BKV(){const f=S.bf||'All',pr=b=>b.day<0&&b.st!=='x',l=S.bk.map((b,i)=>[b,i]).filter(([b])=>f==='Confirmed'?b.st!=='x':f==='Cancelled'?b.st==='x':f==='Previous'?pr(b):1).reverse();
return `<div class="chips">${['All','Confirmed','Cancelled','Previous'].map(c=>`<button class="${f===c?'on':''}" onclick="S.bf='${c}';draw()">${f===c?'✓ ':''}${c}</button>`).join('')}</div>`+(l.length?l.map(([b,i])=>`<div class="rc" onclick="S.tk=S.bk[${i}];draw()"><div class="th" style="width:92px">${E[b.t.s[0]]}</div><div style="flex:1;min-width:0"><b>${b.t.a}, ${S.city}</b><div class="mut" style="font-size:11px">${b.sel.map(h=>sl(h)).join(', ')} · ${dl(b.day)}</div><div style="font-size:12px">⭐ ${b.t.r}</div><b class="g">${ru(b.tot)}</b><div class="row" style="justify-content:flex-start;margin-top:4px"><span class="st" style="background:${b.st==='x'?'#dc2626':'#16a34a'}">${b.st==='x'?'Cancelled':'Confirmed'}</span><span class="mut" style="font-size:10px">Txn: ${b.tx||'pay_'+b.id}</span>${b.st!=='x'&&b.day>=0?`<a class="g" style="font-size:11px;font-weight:800" onclick="event.stopPropagation();S.bk[${i}].st='x';draw();say('Booking cancelled (mock refund)')">Cancel</a>`:''}</div></div></div>`).join(''):`<div style="text-align:center;padding:50px 20px"><div style="font-size:52px">🏟️</div><h2>No bookings here yet</h2><button class="btn" onclick="go('turfs')">Browse Turfs</button></div>`)}
S.bk.push({id:'TB100231',t:T[1],day:-20,sel:[8],tot:1100,m:'UPI',tx:'pay_R7nisbSAHpejOr'},{id:'TB100198',t:T[1],day:-9,sel:[15],tot:1100,m:'UPI',st:'x',tx:'pay_RQN82Blaweg3Lm'});

S.mc={m:'cost',tid:1,h:1,pl:10,ex:0,to:20,ru:'',ov:'',tg:''};
const INP='style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:15px;margin:4px 0 10px"';
const mstp=(k,l,mn,mx)=>`<div class="row" style="margin:6px 0"><b>${l}</b><span><button class="pill" onclick="S.mc.${k}=Math.max(${mn},S.mc.${k}-1);draw()">−</button> <b style="margin:0 8px">${S.mc[k]}</b> <button class="pill" onclick="S.mc.${k}=Math.min(${mx},S.mc.${k}+1);draw()">+</button></span></div>`;
const mrow=(l,v,big,c)=>`<div class="row" style="padding:5px 0"><span style="${big?'font-weight:900;font-size:18px':''}">${l}</span><b style="font-size:${big?22:15}px;${c?'color:'+c:''}">${v}</b></div>`;
function MCR(){const m=S.mc;
if(m.m==='cost'){const t=T.find(x=>x.id==m.tid),base=t.p*m.h,fee=Math.round(base*.00375*2)/2,ex=+m.ex||0,tot=base+fee+ex;return `<div class="card">${mrow('Turf ('+m.h+'h × '+ru(t.p)+')',ru(base))}${mrow('Platform fee',ru(fee))}${ex?mrow('Extras',ru(ex)):''}<hr style="border:0;border-top:1px solid var(--bd)">${mrow('Total',ru(tot),1)}${mrow('Per player ('+m.pl+')',ru(Math.ceil(tot/m.pl)),1,'#16a34a')}${mrow('Per team (2 teams)',ru(Math.ceil(tot/2)))}</div><button class="btn" onclick="open_(${t.id})">Book this turf</button>`}
const bl=o=>{const p=String(o).split('.');return (parseInt(p[0])||0)*6+Math.min(5,parseInt(p[1])||0)},r=parseInt(m.ru)||0,b=bl(m.ov),tg=parseInt(m.tg)||0,crr=b?r/(b/6):0,left=m.to*6-b,need=tg-r,rrr=need>0&&left>0?need/(left/6):0;
return `<div class="card">${mrow('Current run rate',crr.toFixed(2),1,'#16a34a')}${mrow('Balls bowled / left',b+' / '+Math.max(0,left))}${mrow('Projected score ('+m.to+' ov)',Math.round(crr*m.to))}${tg?`<hr style="border:0;border-top:1px solid var(--bd)">`+(need<=0?'<b class="g" style="font-size:18px">🏆 Target achieved!</b>':left<=0?`<b style="color:#dc2626">❌ Innings over — lost by ${need-1} runs</b>`:mrow('Runs needed',need)+mrow('Required run rate',rrr.toFixed(2),1,rrr>crr?'#dc2626':'#16a34a')):''}</div>`}
function mcu(){$('mcr').innerHTML=MCR()}
function MCV(){const m=S.mc,ch=(k,v,l)=>`<button class="${m[k]===v?'on':''}" onclick="S.mc.${k}=${typeof v==='string'?`'${v}'`:v};draw()">${l}</button>`;
return `<a href="#" class="g" style="font-weight:800" onclick="S.view='';draw();return false">← Back</a><h2>Match Calculator</h2><div class="chips">${ch('m','cost','💰 Cost Split')}${ch('m','cr','🏏 Cricket Run Rate')}</div>`+(m.m==='cost'?`<div class="card"><b>Turf</b><select ${INP} onchange="S.mc.tid=+this.value;mcu()">${T.map(t=>`<option value="${t.id}" ${t.id===m.tid?'selected':''}>${t.n} · ${ru(t.p)}/hr</option>`).join('')}</select>${mstp('h','Hours',1,6)}${mstp('pl','Players (total)',2,22)}<b>Extras: ball / umpire / equipment (₹)</b><input ${INP} type="number" value="${m.ex}" oninput="S.mc.ex=this.value;mcu()"></div>`:`<div class="card"><b>Match overs</b><div class="chips" style="margin:6px 0 12px">${[5,6,10,20].map(o=>ch('to',o,o)).join('')}</div><b>Runs scored</b><input ${INP} type="number" value="${m.ru}" oninput="S.mc.ru=this.value;mcu()"><b>Overs bowled (e.g. 7.3)</b><input ${INP} type="text" inputmode="decimal" value="${m.ov}" oninput="S.mc.ov=this.value;mcu()"><b>Target to chase (optional)</b><input ${INP} type="number" value="${m.tg}" oninput="S.mc.tg=this.value;mcu()"></div>`)+`<div id="mcr">${MCR()}</div>`}
function draw(){
const k=S.view||S.tab,nv=[['turfs','⚽','Turfs'],['book','📖','Booking'],['home','🏠','Home'],['ev','🏆','Tournaments'],['prof','👤','Profile']];
$('app').innerHTML=`${GH(k)}<main>${V[k]()}</main>
<nav>${nv.map(n=>`<button class="${S.tab===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>${S.tk?tkt(S.tk):''}${S.prof&&S.user?profv():''}${S.auth?authv():''}${S.tm&&S.user?teamv():''}${S.toast?`<div class="toast">${S.toast}</div>`:''}`}
draw();
</script>
</body>
</html>
